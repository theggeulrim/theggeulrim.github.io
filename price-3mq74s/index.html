<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LGU+더끌림컴퍼니 직원용 단가표</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--sub:#6b7280;--line:#e5e7eb;--acc:#E6007E;--acc-soft:#fde7f2;--ok:#0f766e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1100px;margin:0 auto}
h1{font-size:17px;margin:0 12px 0 0;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--sub);font-weight:600;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
input[type=search]{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.sheet-title{color:var(--sub);font-size:13px;margin:0 0 12px}
.grp{margin-bottom:22px}
.grp h2{font-size:14px;margin:0 0 8px;color:var(--sub);font-weight:700}
.model{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafafa}
.mhead b{font-size:15px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--sub);font-weight:600}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--acc-soft)}
td.ag{color:var(--acc);font-weight:700}
td.fin{font-weight:800}
td.cp{width:1%}
.cpb{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.cpb.qb{border-color:var(--acc);color:var(--acc);font-weight:700}
.empty{color:var(--sub);padding:40px;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;white-space:pre-line;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{color:var(--sub);font-size:12px;margin-left:auto}
@media (max-width:640px){
  .hide-sm{display:none}
  td,th{padding:7px 8px}
  .seg[data-k=n]{display:flex;width:100%}
  .seg[data-k=n] button{flex:1;padding:7px 0}
  td.cp,thead th:last-child{display:none}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>상담 단가표</h1>
    <div class="seg" data-k="ch"><button data-v="홈페이지">홈페이지</button><button data-v="온라인">온라인</button><button data-v="모요">모요</button></div>
    <div class="seg" data-k="type"><button data-v="번호이동">번호이동</button><button data-v="기기변경">기기변경</button></div>
    <div class="seg" data-k="plan"><button data-v="85">85요금제</button><button data-v="115">115요금제</button></div>
    <div class="seg" data-k="dc"><button data-v="sub">공시지원금</button><button data-v="sel">선택약정</button></div>
    <div class="seg" data-k="n"><button data-v="0">일시불</button><button data-v="12">12개월</button><button data-v="24">24개월</button><button data-v="30">30개월</button><button data-v="36">36개월</button><button data-v="48">48개월</button></div>
    <input type="search" id="q" placeholder="모델 검색 (예: 폴드, 18, S26)">
    <button class="btn acc" id="copyAll">이 단가표 전체 복사</button>
  </div>
</header>
<main>
  <p class="sheet-title" id="sheetTitle"></p>
  <div id="list"></div>
  <p class="hint" style="margin-top:20px">줄(모바일은 줄 터치)이나 견적서복사 버튼을 누르면 그 용량 견적서(위에서 고른 할부 개월 기준, 연 5.9%)가 복사되고, 모델 이름 옆 버튼은 그 모델의 전 용량을 복사합니다. 선택약정은 이통사 지원금 없이 요금제 25% 할인(85요금제 월 21,250원·115요금제 월 28,750원, 24개월)이고 대리점 지원금은 같습니다. 기준: 2026-10-02</p>
</main>

const KEY = 'consult-sheet-state';
let st = {ch:'온라인', type:'번호이동', plan:'85', n:'24', dc:'sub'};
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && DATA[s.ch+'|'+s.type+'|'+s.plan]) st = Object.assign(st, s); } catch(e) {}
if (!['0','12','24','30','36','48'].includes(st.n)) st.n = '24';
if (!['sub','sel'].includes(st.dc)) st.dc = 'sub';

const won = n => n.toLocaleString('ko-KR');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function copy(text, label) {
  const done = () => toast(label + ' 복사됨');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) { toast('복사 실패 — 직접 선택해 주세요'); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}
let tt;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1400);
}

function sheet() { return DATA[st.ch+'|'+st.type+'|'+st.plan]; }
function sheetTitle() { const t = sheet().title; return isSel() ? t.replace(/\]$/, ', 선택약정 25%]') : t; }

// 견적서 문구: 홈페이지 견적 카톡 전송과 같은 계산 (연 5.9%, 월 할부금 10원 미만 절사)
const PLAN_NM = {'85': ['5G 데이터플랜 MAX', 85000], '115': ['플러스플랜115', 115000]};
// 선택약정: 이통사 지원금 대신 요금제 25% 할인(24개월), 대리점 지원금은 그대로 (홈페이지 견적과 같은 규칙)
const SEL_DC = {'85': 21250, '115': 28750};
const isSel = () => st.dc === 'sel';
const prinOf = it => isSel() ? Math.max(0, it.retail - it.agency) : it.final;
function rowText(it) {
  if (!isSel()) return it.text;
  const L = it.text.split('\n');
  return [L[0], '출고가 ' + won(it.retail) + '원', '선택약정 25% 요금할인 월 -' + won(SEL_DC[st.plan]) + '원 (24개월)', '대리점 지원금 -' + won(it.agency) + '원', '할부원금 ' + won(prinOf(it)) + '원', L[L.length - 1]].join('\n');
}
function inst(prin, n) {
  if (!n || prin <= 0) return {m: 0, fee: 0};
  const rate = 0.059 / 12, f10 = x => Math.floor(x / 10) * 10;
  const ex = prin * rate / (1 - Math.pow(1 + rate, -n));
  return {m: f10(ex), fee: Math.max(0, f10(ex * n - prin))};
}
function quoteText(it) {
  const n = Number(st.n), prin = prinOf(it), {m: devM, fee} = inst(prin, n);
  const [planNm, planFee] = PLAN_NM[st.plan];
  const selDc = isSel() ? SEL_DC[st.plan] : 0, planM = planFee - selDc;
  const L = [
    '[휴대폰 개통 견적]',
    n ? n + '개월 할부 기준 · 할부이자(연 5.9%) 포함' : '일시불 기준',
    '',
    '기종 : ' + it.model,
    '용량 : ' + it.cap,
    '가입유형 : ' + st.type,
    '할인유형 : ' + (isSel() ? '선택약정 25%' : '공시지원금'),
    '',
    '<6개월 유지 요금제>',
    '요금제 : ' + planNm,
    '월 요금 : ' + won(planFee) + '원'
  ];
  if (selDc) L.push('요금 할인 : -' + won(selDc) + '원 (선택약정 25%, 24개월)');
  L.push('',
    '<기기>',
    '출고가 : ' + won(it.retail) + '원',
    selDc ? it.carrierLabel + ' : 0원 (선택약정 선택)' : it.carrierLabel + ' : -' + won(it.carrier) + '원',
    '대리점 지원금 : -' + won(it.agency) + '원',
    '할부원금 : ' + won(prin) + '원');
  if (n) L.push('할부개월 : ' + n + '개월', '할부원금+이자 : ' + won(prin + fee) + '원');
  else L.push('할부개월 : 일시불');
  L.push('',
    '■ 기기 월 할부금 : ' + (n ? won(devM) + '원' : '0원 (일시불)'),
    '■ 요금제 월 요금 : ' + won(planM) + '원' + (selDc ? ' (25% 할인 적용)' : ''),
    '────────────────',
    '■ 월 납부금 : ' + won(devM + planM) + '원',
    '',
    NOTE);
  return L.join('\n');
}
const NOTE = '*할부원금은 개통 후 언제든 완납할 수 있어요.' + '\n' + '*6개월 후엔 요금제 변경이 가능해요. 단, 월 47,000원 이상 요금제로만 바꿀 수 있어요.';

function render() {
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {}
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === st[seg.dataset.k])));
  const sh = sheet(), q = document.getElementById('q').value.trim().toLowerCase().replace(/\s/g,'');
  document.getElementById('sheetTitle').textContent = sheetTitle();
  let html = '';
  sh.groups.forEach((g, gi) => {
    const models = [];
    g.items.forEach((it, ii) => {
      if (q && !it.model.toLowerCase().replace(/\s/g,'').includes(q)) return;
      let m = models.find(x => x.name === it.model);
      if (!m) { m = {name: it.model, rows: []}; models.push(m); }
      m.rows.push([it, gi, ii]);
    });
    if (!models.length) return;
    html += '<section class="grp"><h2>' + esc(g.name) + '</h2>';
    models.forEach(m => {
      const ids = m.rows.map(r => r[1] + '-' + r[2]).join(',');
      html += '<div class="model"><div class="mhead"><b>' + esc(m.name) + '</b><button class="cpb" data-many="' + ids + '">전 용량 복사</button></div>'
        + '<table><thead><tr><th>용량</th><th class="hide-sm">출고가</th><th class="hide-sm">' + (isSel() ? '선택약정 (월)' : esc(m.rows[0][0].carrierLabel)) + '</th><th>대리점 지원금</th><th>할부원금</th><th>' + (st.n === '0' ? '일시불' : '월 할부금') + '</th><th></th></tr></thead><tbody>';
      m.rows.forEach(([it, a, b]) => {
        html += '<tr data-one="' + a + '-' + b + '"><td>' + it.cap + '</td><td class="hide-sm">' + won(it.retail) + '</td><td class="hide-sm">-' + won(isSel() ? SEL_DC[st.plan] : it.carrier)
          + '</td><td class="ag">-' + won(it.agency) + '</td><td class="fin">' + won(prinOf(it)) + '원</td><td>' + (st.n === '0' ? '-' : won(inst(prinOf(it), Number(st.n)).m) + '원') + '</td><td class="cp"><button class="cpb qb">견적서복사</button></td></tr>';
      });
      html += '</tbody></table></div>';
    });
    html += '</section>';
  });
  document.getElementById('list').innerHTML = html || '<div class="empty">검색 결과가 없습니다</div>';
}

const item = id => { const [a, b] = id.split('-').map(Number); return sheet().groups[a].items[b]; };

document.addEventListener('click', e => {
  const segBtn = e.target.closest('.seg button');
  if (segBtn) { st[segBtn.parentNode.dataset.k] = segBtn.dataset.v; render(); return; }
  const many = e.target.closest('[data-many]');
  if (many) { const its = many.dataset.many.split(',').map(item); copy(its.map(rowText).join('\n\n') + '\n\n' + NOTE, its[0].model + ' 전 용량'); return; }
  const one = e.target.closest('[data-one]');
  if (one) { const it = item(one.dataset.one); copy(quoteText(it), it.model + ' ' + it.cap + ' 견적서'); }
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('copyAll').addEventListener('click', () => {
  const sh = sheet();
  const body = sh.groups.map(g => g.items.map(rowText).join('\n\n')).join('\n\nㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡ\n\n');
  copy(sheetTitle() + '\n\n' + body + '\n\n' + NOTE, sheetTitle().replace(/[\[\]]/g,''));
});
render();
</script>
