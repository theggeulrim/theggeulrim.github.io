<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGU+ 핫딜센터 오늘 시세</title>
<link rel="canonical" href="https://theggeulrim.com/price/">
<meta property="og:title" content="LGU+ 핫딜센터 오늘 시세">
<meta property="og:url" content="https://theggeulrim.com/price/">
<meta property="og:type" content="website">
<meta name="description" content="LGU+ 핫딜센터 · LG U+ 휴대폰 오늘 시세. 출고가, 공시지원금, 할부원금, 2년 총 납입금까지 먼저 확인하고 가까운 더끌림컴퍼니 매장에서 개통하세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --gx:20px;--px:18px;
  --fg:#111;--fg2:#4A505B;--grey:#8B919C;--bg:#fff;--soft:#F5F6F8;--line:#ECEEF1;--card:#fff;
  --pink:#E6007E;--pink-l:#FDE6F1;--green:#0F9D58;--green-l:#E6F6EE;--red:#E5383B;
  --kakao:#FEE500;--kakao-fg:#191600;--dark:#111;--on-dark:#fff;
  --lift:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fg:#F2F3F5;--fg2:#C2C7CF;--grey:#8E949E;--bg:#0E0F11;--soft:#1A1C20;--line:#26292E;--card:#15171A;
  --pink:#FF3D9E;--pink-l:#3A1428;--green:#3DD68C;--green-l:#13301F;--dark:#F2F3F5;--on-dark:#111;--lift:none}}
:root[data-theme="dark"]{
  --fg:#F2F3F5;--fg2:#C2C7CF;--grey:#8E949E;--bg:#0E0F11;--soft:#1A1C20;--line:#26292E;--card:#15171A;
  --pink:#FF3D9E;--pink-l:#3A1428;--green:#3DD68C;--green-l:#13301F;--dark:#F2F3F5;--on-dark:#111;--lift:none}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--fg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3,b,p{word-break:keep-all}
.tbl,.rk-p,.res,.pc .pr,.hl b,.stats b,.cat small{font-variant-numeric:tabular-nums}
/* 헤더 */
.hd{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd-in{max-width:560px;margin:0 auto;height:56px;padding:0 var(--gx);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:5px;font-weight:800;font-size:19px;letter-spacing:-.6px;height:44px;white-space:nowrap}
.brand em{font-style:normal;color:var(--pink)}
.kbtn{display:inline-flex;align-items:center;gap:6px;background:var(--kakao);color:var(--kakao-fg);font-weight:700;font-size:14px;border-radius:12px;padding:0 14px;height:40px;white-space:nowrap}
.kbtn svg{width:18px;height:18px}
.back{display:flex;align-items:center;gap:4px;font-weight:700;font-size:16px;height:44px;padding-right:12px}
/* 공통 */
.sec{padding:28px var(--gx) 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sec-h h2{font-size:21px;font-weight:800;letter-spacing:-.7px}
.sec-h span{font-size:14px;color:var(--grey)}
.sec-h a{font-size:14px;color:var(--pink);font-weight:600;padding:12px 0 12px 16px;margin:-12px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--lift)}
.note{font-size:13px;color:var(--grey);margin-top:10px;line-height:1.55}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
/* 히어로 */
.hero{padding:36px var(--gx) 8px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--fg2);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 4px var(--pink-l)}
.hero h1{font-size:33px;line-height:1.25;font-weight:800;letter-spacing:-1.3px;margin-top:18px}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{color:var(--fg2);margin-top:12px;font-size:15.5px}
.cta{display:flex;gap:8px;margin-top:22px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;font-weight:700;font-size:16px}
.btn-dark{background:var(--dark);color:var(--on-dark)}
.btn-line{border:1px solid var(--line);background:var(--card)}
.btn-pink{background:var(--pink);color:#fff}
.btn-kakao{background:var(--kakao);color:var(--kakao-fg)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:26px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.8px}
.stats span{font-size:12.5px;color:var(--grey)}
/* 배너 카드 */
.banners{padding:24px var(--gx) 0;display:grid;gap:10px}
.bn{display:flex;align-items:center;gap:14px;padding:16px var(--px)}
.bn-ic{width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.bn-ic.p{background:var(--pink-l)}.bn-ic.g{background:var(--green-l)}
.bn-t small{display:block;font-size:12.5px;color:var(--grey)}
.bn-t b{font-size:16px;font-weight:700;letter-spacing:-.4px}
.bn .arr{margin-left:auto;color:var(--grey)}
/* 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gx) * -1);padding:2px var(--gx) 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 18px;border-radius:99px;border:1px solid var(--line);font-weight:600;color:var(--fg2);background:var(--card);font-size:15px}
.chip.on{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.region-info{margin-top:12px;font-size:13.5px;color:var(--fg2)}
.region-info b{color:var(--fg)}
/* 분류 카드 */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{position:relative;background:var(--soft);border-radius:20px;padding:16px var(--px) 0;height:178px;overflow:hidden;display:block}
.cat b{font-size:17px;font-weight:800;letter-spacing:-.5px;display:block}
.cat small{font-size:13px;color:var(--grey)}
.cat img{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);height:118px;object-fit:contain}
.cat .ico{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:64px;line-height:1}
.cat .go{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--fg2)}
/* 공시 카드 */
.sub-card{display:flex;align-items:center;justify-content:space-between;padding:18px var(--px);margin-top:10px}
.sub-card small{display:block;font-size:12.5px;color:var(--grey)}
.sub-card b{font-size:17px;font-weight:700}
.sub-card span{display:block;font-size:13px;color:var(--fg2);margin-top:2px}
/* TOP5 */
.rank{padding:4px var(--px)}
.rk{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk-n{width:18px;font-weight:800;color:var(--grey);font-size:16px;text-align:center}
.rk:first-child .rk-n{color:var(--pink)}
.rk img{width:46px;height:46px;object-fit:contain;flex:none}
.rk-t{flex:1;min-width:0}
.rk-t b{font-size:15.5px;font-weight:700;display:block}
.rk-t small{font-size:12.5px;color:var(--grey);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-p{flex:none}
.rk-p{text-align:right}
.rk-p b{font-size:17px;font-weight:800;letter-spacing:-.5px;display:block}
.rk-p small{font-size:12.5px;color:var(--pink);font-weight:600}
/* 꿀팁·FAQ */
.tips{padding:4px var(--px)}
.tip{display:flex;gap:14px;align-items:center;width:100%;padding:16px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15.5px;font-weight:600}
.tip:last-child{border-bottom:0}
.tip i{font-style:normal;font-weight:800;color:var(--grey);font-size:14px;width:20px}
.faq{padding:0 var(--px)}
.faq details{border-bottom:1px solid var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-weight:600;font-size:15.5px;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--grey);border-bottom:2px solid var(--grey);transform:rotate(45deg);margin:-4px 4px 0 12px;transition:transform .2s;flex:none}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.faq p{padding:0 0 18px;color:var(--fg2);font-size:14.5px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:14px;color:var(--fg2);background:var(--soft);border-radius:10px;padding:0 12px;height:40px;display:inline-flex;align-items:center}
.links h3{width:100%;font-size:14px;color:var(--grey);font-weight:600;margin-top:8px}
/* 푸터 */
.ft{padding:36px var(--gx) 20px;margin-top:36px;border-top:1px solid var(--line);font-size:12.5px;color:var(--grey);line-height:1.75}
.ft b{color:var(--fg2);font-size:14px}
/* 하단 탭 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:536px;height:66px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;display:flex;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--grey);font-weight:600;position:relative}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--fg)}
.tabbar a.on::after{content:"";position:absolute;bottom:8px;width:22px;height:3px;border-radius:2px;background:var(--pink)}
/* 기종 목록 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--soft);border-radius:20px;padding:14px;display:block;position:relative}
.pc-img{height:130px;display:flex;align-items:center;justify-content:center}
.pc-img img{max-height:120px;max-width:100%;object-fit:contain}
.pc b{display:block;font-size:15px;font-weight:700;margin-top:8px;line-height:1.3}
.pc small{display:block;font-size:12px;color:var(--grey);margin-top:2px}
.pc .pr{font-size:18px;font-weight:800;letter-spacing:-.5px;margin-top:6px}
.pc .pr em{font-style:normal;font-size:13px;color:var(--pink);margin-right:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--pink-l);color:var(--pink);position:absolute;left:12px;top:12px}
.tag.g{background:var(--green-l);color:var(--green)}
/* 기종 상세 */
.mh{padding:22px var(--gx) 0;display:flex;gap:16px;align-items:center}
.mh img{width:96px;height:110px;object-fit:contain;background:var(--soft);border-radius:18px;padding:8px;flex:none}
.mh h1{font-size:24px;font-weight:800;letter-spacing:-.9px;line-height:1.3}
.mh small{font-size:13px;color:var(--grey);display:flex;align-items:center;gap:6px;margin-top:4px}
.mh small i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.hl{margin:18px var(--gx) 0;padding:20px var(--px);background:var(--dark);color:var(--on-dark);border-radius:20px}
.hl small{font-size:13px;opacity:.7}
.hl b{display:block;font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:2px}
.hl span{font-size:13px;opacity:.75}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;color:var(--grey);font-size:12.5px;text-align:left;padding:12px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{font-size:16px;font-weight:800;display:block}
.tbl td small{font-size:12px;color:var(--grey)}
.tbl .r{text-align:right;white-space:nowrap}
.tbox{padding:0 calc(var(--px) - 8px);overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:600;color:var(--grey)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{margin-top:16px}
.field>label{display:block;font-size:13px;color:var(--grey);font-weight:600;margin-bottom:6px}
.field select{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px}
.calc{padding:20px var(--px)}
.res{margin-top:18px;background:var(--soft);border-radius:16px;padding:16px}
.res dl{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px}
.res dt{color:var(--fg2)}
.res dd{text-align:right;font-weight:600}
.res dd.dc{color:var(--pink)}
.res .sum{border-top:1px solid var(--line);margin-top:10px;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.res .sum b{font-size:22px;font-weight:800;letter-spacing:-.7px}
.res .tot{display:flex;justify-content:space-between;font-size:13.5px;color:var(--fg2);margin-top:6px}
.store{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.store:last-child{border-bottom:0}
.store img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
.store b{font-size:15px;font-weight:700;display:block}
.store small{font-size:12.5px;color:var(--grey);display:block}
.store>div{min-width:0}
.store a{margin-left:auto;flex:none;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;display:flex;align-items:center}
.acts{display:flex;gap:8px;padding:16px var(--gx) 0}
.acts button,.acts a{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14.5px;background:var(--card)}
.acts .on{color:var(--pink);border-color:var(--pink)}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:536px;display:flex;gap:8px;z-index:41}
.sticky .btn{box-shadow:0 10px 30px rgba(0,0,0,.12)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px var(--gx) calc(28px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.6px;margin-bottom:12px}
.sheet p,.sheet li{color:var(--fg2);font-size:15px;margin-top:8px}
.sheet ul{padding-left:18px}
.sheet .btn{margin-top:20px;width:100%}
.empty{text-align:center;color:var(--grey);padding:50px var(--gx)}
.subtbl td,.subtbl th{padding:11px 6px}
.subtbl td{font-size:13.5px}
.subtbl td:first-child{min-width:88px}
/* 작은 화면 */
@media (max-width:380px){
  :root{--gx:16px;--px:16px}
  .hero{padding-top:28px}
  .hero h1{font-size:28px;letter-spacing:-1px}
  .hero p{font-size:15px}
  .btn{font-size:15px;height:50px}
  .stats b{font-size:19px}
  .stats span{font-size:12px}
  .bn{gap:12px}
  .bn-ic{width:46px;height:46px;font-size:23px}
  .bn-t b{font-size:15px}
  .cats,.grid{gap:8px}
  .cat{height:160px}
  .cat b{font-size:16px}
  .cat img{height:104px;bottom:-20px}
  .cat .ico{font-size:56px}
  .pc{padding:12px}
  .pc-img{height:110px}
  .pc-img img{max-height:100px}
  .pc .pr{font-size:16.5px}
  .mh{gap:12px}
  .mh img{width:80px;height:94px}
  .mh h1{font-size:21px}
  .hl b{font-size:27px}
  .tbl td,.tbl th{padding-left:6px;padding-right:6px}
  .tbl td b{font-size:15px}
  .tbox{padding:0 10px}
  .sec-h h2{font-size:19.5px}
  .kbtn{padding:0 11px;font-size:13.5px}
  .brand{font-size:18px}
  .res .sum b{font-size:20px}
  .rk{gap:10px}
  .acts{gap:6px}
  .acts button,.acts a{font-size:13.5px;gap:4px}
  .tbl td small{font-size:11.5px}
  .subtbl td,.subtbl th{padding-left:3px;padding-right:3px}
  .subtbl td{font-size:12.5px}
  .subtbl td:first-child{min-width:72px}
  .subtbl td b{font-size:14px}
  .field select{padding:0 10px}
  .rk img{width:38px;height:38px}
  .rk-t b{font-size:15px}
  .rk-p b{font-size:16px}
}
@media (max-width:340px){
  .hero h1{font-size:25px}
  .chip{padding:0 14px;font-size:14px}
  .tabbar a{font-size:11px}
}
</style>
</head>
<body>
<header class="hd"><div class="hd-in" id="hd"></div></header>
<main class="wrap" id="app"></main>
<nav class="tabbar" id="tabbar">

  <a href="#/subsidy" data-t="subsidy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 9h8M12 9v8M9 13h6"/></svg>공시지원금</a>

  <a href="#/favs" data-t="favs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>찜</a>
</nav>
