<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LGU+더끌림컴퍼니 파트너스</title>
<meta name="robots" content="noindex">
<style>
:root{--bd:#1B64F2;--bd2:#E8F0FE;--red:#F0443C;--red2:#FDECEB;--ink:#191F28;--ink2:#4E5968;--ink3:#8B95A1;--line:#E5E8EB;--bg:#F2F4F6;--card:#fff;--ok:#0BA360;--ok2:#E3F6EC;--warn:#F59E0B;--warn2:#FEF3DC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bd:#4C8DFF;--bd2:#1C2A44;--red2:#3A1E1E;--ink:#F2F4F6;--ink2:#C1C7CE;--ink3:#8B95A1;--line:#2C333B;--bg:#101317;--card:#191D22;--ok2:#163126;--warn2:#3A2E14}}
:root[data-theme="dark"]{--bd:#4C8DFF;--bd2:#1C2A44;--red2:#3A1E1E;--ink:#F2F4F6;--ink2:#C1C7CE;--ink3:#8B95A1;--line:#2C333B;--bg:#101317;--card:#191D22;--ok2:#163126;--warn2:#3A2E14}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.demo{background:var(--warn2);color:#8A5A00;font-size:12px;text-align:center;padding:6px 16px}
/* 레이아웃 */
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{font-weight:800;font-size:18px;white-space:nowrap;color:var(--bd);padding:0 10px}
.logo b{color:var(--ink)}
.logo small{display:block;font-size:12px;color:var(--ink3);font-weight:700;margin-top:2px}
.who{margin:16px 0 10px;padding:12px 10px;border-radius:10px;background:var(--bg)}
.who b{display:block;font-size:14px}
.who span{font-size:12px;color:var(--ink3)}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:10px 10px;border-radius:8px;font-weight:600;color:var(--ink2);margin-bottom:2px}
.nav a.on{background:var(--bd2);color:var(--bd)}
.nav a i{font-style:normal;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px}
.side .bot{margin-top:auto;font-size:12px;color:var(--ink3);padding:0 10px}
.side .bot a{display:block;padding:4px 0}
.main{flex:1;min-width:0;padding:24px 28px 60px}
.h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.h1 small{font-size:13px;color:var(--ink3);font-weight:500;margin-left:8px}
.desc{color:var(--ink3);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--bd);border-color:var(--bd);color:#fff}
.btn.red{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.in,.sel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.tag.b{background:var(--bd2);color:var(--bd)}.tag.g{background:var(--ok2);color:var(--ok)}.tag.r{background:var(--red2);color:var(--red)}.tag.y{background:var(--warn2);color:#B26B00}
.seg{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px}
.seg button{padding:6px 12px;border-radius:7px;font-weight:600;color:var(--ink3);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button em{font-style:normal;margin-left:4px;color:var(--bd)}
/* 표 */
.tw{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--bg);color:var(--ink2);font-weight:700;text-align:left;padding:9px 10px;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr.new td{background:color-mix(in srgb,var(--bd2) 55%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .in,td .sel{padding:5px 8px;font-size:13px}
.memo{width:130px}
/* 시세표 */
.pg td{padding:6px 8px}
.pg .mname{font-weight:700}
.pg input{width:92px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--card);font-variant-numeric:tabular-nums}
.pg input.chg{border-color:var(--bd);background:var(--bd2)}
.pg .hint{display:block;font-size:11px;color:var(--ink3);text-align:right;margin-top:2px}
.pg .hint.lo{color:var(--red);font-weight:700}
.pg .hint.win{color:var(--ok);font-weight:700}
.pg th.g{text-align:center;border-left:1px solid var(--line)}
.pg td.gs{border-left:1px solid var(--line)}
.cd{font-weight:800;color:var(--red)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.kv div{background:var(--bg);border-radius:10px;padding:14px}
.kv span{font-size:12px;color:var(--ink3)}
.kv b{display:block;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
/* 매장 */
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px}
.sc img,.sc .ph{width:84px;height:84px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px}
.sc b{font-size:15px}
.sc p{font-size:12px;color:var(--ink3);margin-top:2px}
.sc .row{margin-top:6px;gap:4px}
/* 모달 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.dim.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:22px}
.modal h3{font-size:18px;margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.modal .in,.modal .sel{width:100%}
.ck{display:flex;align-items:center;gap:8px;padding:6px 0}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#191F28;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
/* 로그인 */
.login{max-width:440px;margin:60px auto;padding:0 16px}
.login .card{padding:24px}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;background:var(--card)}
.pick b{display:block}
.pick span{font-size:12px;color:var(--ink3)}
.log{font-size:12px;color:var(--ink3)}
@media (max-width:820px){
  .app{display:block}
  .side{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
  .who,.side .bot{display:none}
  .nav{display:flex;gap:4px;overflow-x:auto;width:100%}
  .nav a{flex:none}
  .main{padding:16px 16px 60px}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="dim" id="dim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="../js/catalog.js"></script>
<script src="../js/engine.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>window.DB_MODE='partner'</script>
<script src="../js/db.js"></script>
<script src="partners.js"></script>
</body>
</html>
