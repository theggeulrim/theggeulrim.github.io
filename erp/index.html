<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f6fa">
<title>온라인팀 실적 관리 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--soft:#f2f4f8;--line:#e8ebf0;--tx:#191f28;--tx2:#6b7684;--tx3:#a0a8b3;
  --blue:#2b6ef2;--bluebg:#eaf1fe;--orange:#f08c00;--orangebg:#fff4e5;--green:#0f9d58;--greenbg:#e6f6ed;--red:#e5484d;--redbg:#fdecec;
  --sh:0 1px 2px rgba(20,30,50,.04),0 4px 14px rgba(20,30,50,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
body.withbar{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.who{background:var(--card);box-shadow:var(--sh);border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--tx2)}
.who b{color:var(--blue)}
.sub{color:var(--tx2);font-size:14px;margin-top:4px}
.demo{margin-top:12px;background:var(--orangebg);color:#9a5a00;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.demo button{background:#fff;border:1px solid #f3c98b;border-radius:8px;padding:5px 9px;font-size:12px;color:#9a5a00;white-space:nowrap;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.kpi .l{color:var(--tx2);font-size:14px;font-weight:500}
.kpi .v{font-size:26px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{color:var(--tx3);font-size:13px}
.kpi.big{grid-column:1/-1}
.kpi.hero{grid-column:1/-1;background:var(--blue);color:#fff}
.kpi.hero .l,.kpi.hero .s{color:rgba(255,255,255,.82)}
.kpi.hero .v{font-size:34px}
.neg{color:var(--red)!important}
.pos{color:var(--green)}
h2{font-size:18px;font-weight:700;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em}
h2 small{font-size:13px;color:var(--tx2);font-weight:500}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.bar{margin:4px 0 14px}
.bar:last-child{margin-bottom:4px}
.bar .r{display:flex;justify-content:space-between;font-size:15px;margin-bottom:7px;font-weight:600}
.bar .r span:last-child{font-variant-numeric:tabular-nums}
.bar .r em{font-style:normal;color:var(--tx2);font-size:13px;margin-left:6px;font-weight:500}
.track{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--blue)}
.fill.warn{background:var(--orange)}
.fill.ok{background:var(--green)}
.hint{font-size:13px;color:var(--tx2);margin-top:6px}
.hint b{color:var(--blue)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .a{font-size:15px;font-weight:600}
.it .b{font-size:12px;color:var(--tx2);margin-top:3px;line-height:1.45}
.it .m{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.it .m small{display:block;font-size:11px;color:var(--tx3);font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-right:4px;background:var(--soft);color:var(--tx2)}
.tag.moyo{background:#f1ecff;color:#6b45d6}.tag.hotdeal{background:var(--redbg);color:#c0392b}.tag.online{background:var(--bluebg);color:var(--blue)}
.detail{background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:13px}
.detail .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--tx2);gap:10px}
.detail .row b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.detail .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;color:var(--tx);font-weight:700}
.detail .del{margin-top:8px;background:#fff;border:1px solid #f5c2c3;color:var(--red);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .c i{display:block;width:100%;background:#c9dafc;border-radius:4px 4px 0 0;min-height:2px}
.chart .c i.n{background:#f5b3b5}
.chart .c i.t{background:var(--blue)}
.chart .c span{font-size:9px;color:var(--tx3);margin-top:4px;height:11px}
.pay .row{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;color:var(--tx2)}
.pay .row b{color:var(--tx);font-variant-numeric:tabular-nums}
.pay .row.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:11px;color:var(--tx);font-weight:700;font-size:16px}
.pay .row.tot b{color:var(--blue);font-size:19px}
.pay .row.dim b{color:var(--tx3);font-weight:500}
/* 입력 */
.step{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.step .t{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.step .t i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.form label{display:block;font-size:13px;color:var(--tx2);margin:14px 0 6px;font-weight:600}
.form input,.form select{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:12px;font-size:16px}
.grid2>*{min-width:0}
.form input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
.form input:focus,.form select:focus{outline:0;border-color:var(--blue);background:#fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:0;border:1.5px solid var(--line);background:#fff;padding:11px 4px;border-radius:12px;font-size:15px;color:var(--tx2);cursor:pointer;font-weight:600}
.seg.w5 button{flex:1 1 28%}
.seg button.on{border-color:var(--blue);background:var(--bluebg);color:var(--blue)}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--tx2);cursor:pointer}
.pick button.on{border-color:var(--blue);background:var(--bluebg);color:var(--blue);font-weight:700}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.chk button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.chk button b{display:block;font-size:15px}
.chk button span{font-size:12px;color:var(--tx3)}
.chk button.on{border-color:var(--green);background:var(--greenbg)}
.chk button.on b::before{content:"✓ ";color:var(--green)}
.inline{margin-top:8px}
.calcd{margin-top:4px}
.calcd .row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--tx2)}
.calcd .row b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.calcd .row.minus b{color:var(--red)}
.calcd .row.spot b{color:var(--green)}
.calcd .row.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;color:var(--tx)}
.sbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:9;padding:0 12px 8px}
.sbar .in{max-width:536px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(20,30,50,.14);padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px}
.sbar .nums{flex:1;min-width:0}
.sbar .nums .k{font-size:12px;color:var(--tx2)}
.sbar .nums .v{font-size:22px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.sbar .nums .s{font-size:12px;color:var(--tx3)}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;margin-top:14px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.sbar .btn{width:auto;margin:0;padding:14px 20px;white-space:nowrap}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;color:var(--tx3);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--blue)}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pol .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pol .mh b{font-size:15px}
.pol .mh span{font-size:12px;color:var(--tx3)}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pg.c3{grid-template-columns:repeat(3,1fr)}
.pg.c2{grid-template-columns:repeat(2,1fr)}
.pg div{font-size:11px;color:var(--tx2)}
.pg input{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:8px;padding:7px 6px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;margin-top:3px}
.pg input:focus{border-color:var(--blue);outline:0;background:#fff}
.pg input.chg{border-color:var(--orange)}
.sec{font-size:13px;color:var(--tx2);margin:16px 0 8px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--tx2);white-space:nowrap;cursor:pointer;font-weight:600}
.chips button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.chips select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--tx2);font-weight:600;flex:none;width:auto;cursor:pointer}
.chips select.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.drange{display:flex;align-items:center;gap:8px;margin:-4px 0 12px}
.drange input{flex:1;min-width:0;max-width:180px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;background:#fff;color:var(--tx);-webkit-appearance:none;appearance:none}
.drange span{color:var(--tx3)}
.pastnote{background:#fff8e6;border:1px solid #f3dfa6;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--tx2);line-height:1.6;margin:0 0 12px}
.pastnote button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer;margin-left:4px;color:var(--tx)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.login .opt{background:var(--card);box-shadow:var(--sh);border-radius:18px;padding:18px;margin-top:10px;border:0;text-align:left;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.login .opt b{font-size:18px;display:block}
.login .opt span{font-size:13px;color:var(--tx2)}
.login .opt::after{content:"›";font-size:24px;color:var(--tx3)}
.empty{color:var(--tx3);font-size:14px;text-align:center;padding:24px 0}
.note{font-size:12px;color:var(--tx3);margin-top:8px;line-height:1.55}
.tg{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:10px}
.sw{width:50px;height:30px;border-radius:999px;background:#d5dae1;border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}
.sw.on::after{left:23px}
.tier{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.tier span{flex:none;font-size:11px;padding:4px 8px;border-radius:8px;background:var(--soft);color:var(--tx3);font-weight:600}
.tier span.on{background:var(--greenbg);color:var(--green)}
.tier span.next{background:var(--bluebg);color:var(--blue)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{position:sticky;top:0;z-index:1;background:#eef1f6;color:var(--tx2);font-weight:600;text-align:left;padding:9px 6px;white-space:nowrap;font-size:12px}
.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;white-space:nowrap;vertical-align:middle}
.tbl .r{text-align:right}.tbl .c{text-align:center}
.tbl tr.bad td{background:#fff5f5}
.tbl tbody tr:hover td{background:#f8faff}
.tbl input,.tbl select{background:var(--soft);border:1.5px solid transparent;border-radius:8px;padding:6px;font-size:13px;width:100%;min-width:0}
.tbl input:focus,.tbl select:focus{outline:0;border-color:var(--blue);background:#fff}
.tbl input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.tbl .del{margin:0;padding:4px 8px}
.ptbl input{width:96px;text-align:right}.ptbl td:first-child{min-width:130px}.tbl input.chg{border-color:var(--orange)}
.tscroll{overflow:auto;max-height:68vh;background:var(--card);border-radius:18px;box-shadow:var(--sh)}
.prog .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.prog .l{color:var(--tx2);font-size:14px;font-weight:600}.prog .l small{font-weight:500;color:var(--tx3);margin-left:4px}
.prog .v{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}.prog .v small{font-size:14px;color:var(--tx2);font-weight:500}
.prog .pct{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ptrack{position:relative;height:14px;background:var(--soft);border-radius:999px;margin:12px 0 8px}
.ptrack .fill{border-radius:999px}
.ptrack i{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--tx);border-radius:2px}
.prog .pl{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--tx2)}
.prog .pr3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;margin-top:14px}
.prog .pr3 .bar .r{font-size:13px}.prog .pr3 .track{height:7px}
.pdbtn{display:block;width:100%;margin-top:10px;background:var(--soft);border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:600;color:var(--blue);cursor:pointer}
.pdet{margin-top:6px}.pdet .sec small{font-weight:500;color:var(--tx3);margin-left:4px}
.pdet .row{font-size:14px;padding:4px 0}.pdet .tbl{font-size:12px}
.seltools{margin-top:-4px}
.tools button.warnb{color:var(--red);border-color:#f5c2c3}
.tools button:disabled{opacity:.4;cursor:default}
.tbl tr.on td{background:var(--bluebg)}
.tbl input[data-sel]{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.it .ck{width:20px;height:20px;flex:none;accent-color:var(--blue);margin:0}
.it .ck+div{flex:1;min-width:0}
.list .it.on{background:var(--bluebg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
.tools button,.tools label{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--tx)}
.tools button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.tools input[type=file]{display:none}
.tools .sp{flex:1}
textarea.paste{width:100%;min-height:96px;background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:10px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
textarea.paste:focus{outline:0;border-color:var(--blue);background:#fff}
.err{color:var(--red);font-size:12px;font-weight:600}
.colhelp{font-size:12px;color:var(--tx2);line-height:1.7;margin:8px 0}
.colhelp b{display:inline-block;background:var(--soft);border-radius:6px;padding:0 6px;margin:2px 2px 2px 0;font-weight:600;color:var(--tx)}
/* 11/02 화면 개편: 대시보드·내 급여 */
.chd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.chd b{font-size:16px;font-weight:700}
.chd small{font-size:12px;color:var(--tx3);font-weight:500;margin-left:6px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--tx2);white-space:nowrap}
.pill.ok{background:var(--greenbg);color:var(--green)}.pill.bad{background:var(--redbg);color:var(--red)}
.hero2{display:grid;gap:14px;padding:18px;margin-top:14px}
.hero2 .hl{display:flex;align-items:center;gap:16px}
.hero2 .k{font-size:14px;color:var(--tx2);font-weight:600}.hero2 .k small{color:var(--tx3);font-weight:500;margin-left:4px}
.hero2 .big{font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;margin:2px 0 6px}
.hero2 .big small{font-size:16px;color:var(--tx3);font-weight:600;margin-left:6px}
.hero2 .k2{font-size:13px;color:var(--tx2);margin-top:8px}.hero2 .k2 b{color:var(--tx)}
.ring{width:96px;height:96px;flex:none}
.ring .bg{fill:none;stroke:var(--soft);stroke-width:11}
.ring .fg{fill:none;stroke:var(--orange);stroke-width:11;stroke-linecap:round}
.ring.ok .fg{stroke:var(--blue)}
.ring text{font-size:22px;font-weight:800;fill:var(--tx);font-family:inherit}
.cum{width:100%;height:auto;display:block}
.cum text{font-size:12px;fill:var(--tx3);font-family:inherit}
.cum .gl{stroke:var(--line);stroke-width:1}
.cum .goal{stroke:#9aa4b2;stroke-width:1.6;stroke-dasharray:5 5}
.cum .ar{fill:rgba(43,110,242,.12)}.cum .ln{fill:none;stroke:var(--blue);stroke-width:3;stroke-linejoin:round}
.cum .pj{stroke:var(--blue);stroke-width:2;stroke-dasharray:2 5;opacity:.55;stroke-linecap:round}
.cum .dot{fill:#fff;stroke:var(--blue);stroke-width:3}
.cum .nv{font-size:14px;font-weight:800;fill:var(--blue)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:4px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.lg i.dash{background:repeating-linear-gradient(90deg,#9aa4b2 0 4px,transparent 4px 7px)}
.lg i.dash.lt{background:repeating-linear-gradient(90deg,#8fb1f5 0 2px,transparent 2px 5px)}
.kgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.kgrid .kpi{padding:14px 16px}.kgrid .kpi .v{font-size:23px}
.kgrid .kpi .s{font-size:12px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px}
.dgrid>*{min-width:0}
@media(max-width:999px){.dchart .c:not(.td):not(.mx) b{visibility:hidden}.dchart .c:not(.k) span{visibility:hidden}}
.dgrid>.card{margin:0;padding:16px}
.dchart{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:4px}
.dchart .c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.dchart .c b{font-size:9px;font-weight:700;color:var(--tx2);margin-bottom:3px;white-space:nowrap;height:11px;font-variant-numeric:tabular-nums}
.dchart .c i{display:block;width:100%;max-width:22px;background:#bcd2fb;border-radius:4px 4px 1px 1px}
.dchart .c i.n{background:#f5b3b5}
.dchart .c.td i{background:var(--blue)}.dchart .c.td b{color:var(--blue)}
.dchart .c span{font-size:9px;color:var(--tx3);margin-top:5px;height:11px;font-variant-numeric:tabular-nums}
.dchart .c span.su{color:#e5484d}.dchart .c span.sa{color:#5b8def}
.dchart .c.fu span{opacity:.45}
.dchart .c.td span{color:var(--blue);font-weight:800}
.mini{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.mini button{border:0;background:none;padding:5px 10px;font-size:12px;font-weight:600;color:var(--tx2);border-radius:8px;cursor:pointer}
.mini button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stk{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--soft);gap:2px}
.stk i{display:block;height:100%}
.slg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--tx2);margin-top:9px}
.slg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.slg b{color:var(--tx);font-variant-numeric:tabular-nums}
.slg em{font-style:normal;color:var(--tx3);font-size:12px;margin-left:3px}
.chm{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--tx3);margin-top:8px}.chm b{color:var(--tx2)}
.rank .rr{padding:7px 0}
.rank .rt{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.rank .rt em{font-style:normal;display:inline-block;width:18px;color:var(--tx3);font-size:12px;font-weight:700}
.rank .rt b{font-variant-numeric:tabular-nums}
.rank .rk{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-left:18px}
.rank .rk i{display:block;height:100%;background:var(--blue);border-radius:999px}
.rank .rk i.n{background:var(--red)}
.rank .rs{font-size:12px;color:var(--tx3);margin:4px 0 0 18px}
.steps{display:flex;gap:3px;padding-bottom:2px}
.steps .sp{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap}
.steps .sb{height:8px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:6px}
.steps .sb i{display:block;height:100%;background:var(--blue)}
.steps .sp.on .sb i{background:var(--green)}
.steps .sp b{display:block;font-size:11.5px;letter-spacing:-.03em;color:var(--tx3);font-variant-numeric:tabular-nums}
.steps .sp span{font-size:11px;color:var(--tx3)}
.steps .sp.on b,.steps .sp.on span{color:var(--green)}
.steps .sp.next b,.steps .sp.next span{color:var(--blue);font-weight:800}
.tierc .hint{margin-top:10px}
.hero3{margin-top:14px;padding:20px 18px;background:linear-gradient(135deg,#2b6ef2,#1d4fd8)}
.hero3 .l small{opacity:.75;margin-left:4px;font-size:12px}
.hero3 .v{margin:6px 0 14px}
.stk.wh{background:rgba(255,255,255,.18)}
.slg.wh{color:rgba(255,255,255,.85)}.slg.wh b{color:#fff}
.kgrid.k3{grid-template-columns:repeat(3,1fr)}.kgrid.k3 .kpi{padding:12px}.kgrid.k3 .kpi .v{font-size:19px}.kgrid.k3 .kpi .l{font-size:12px}
.card.list>.chd{margin-bottom:4px}
.card.list>.btn{margin-top:12px}
.pconly{display:none}
@media(min-width:1000px){
  .pconly{display:block}
  body,body.withbar{padding-bottom:30px;padding-left:220px}
  nav{top:0;bottom:0;right:auto;width:220px;border-top:0;border-right:1px solid var(--line);background:#fff;backdrop-filter:none}
  nav .in{flex-direction:column;padding:76px 12px 0;gap:2px}
  nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px;justify-content:flex-start;color:var(--tx2)}
  nav button.on{background:var(--bluebg)}
  nav svg{width:21px;height:21px}
  .wrap{max-width:1240px;padding:28px 36px}
  .wrap.login{max-width:480px}
  body:has(.login){padding-left:0}
  body:has(.login) nav{display:none}
  .grid2{grid-template-columns:repeat(4,1fr)}
  .kpi.big{grid-column:span 4}
  .sbar{left:220px;bottom:0;padding-bottom:16px}
  .form{max-width:640px}
  .hero2{grid-template-columns:minmax(300px,380px) 1fr;align-items:center;padding:22px 24px}
  .hero2 .big{font-size:42px}
  .ring{width:112px;height:112px}
  .kgrid{grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
  .kgrid.k3{grid-template-columns:repeat(3,1fr)}
  .kgrid .kpi .v{font-size:27px}.kgrid.k3 .kpi .v{font-size:24px}.kgrid.k3 .kpi .l{font-size:14px}.kgrid.k3 .kpi{padding:16px}
  .dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
  .dgrid>.span2{grid-column:span 2}
  .dchart{height:180px;gap:4px}.dchart .c b,.dchart .c span{font-size:11px}
  .hero3{padding:26px 28px}.hero3 .v{font-size:42px}
}

const inMonth=x=>x.date.slice(0,7)===MONTH;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function barRow(label,pct,extra){
  const p=Math.max(0,Math.min(100,pct));
  return `<div class="bar"><div class="r"><span>${label}${extra?`<em>${extra}</em>`:''}</span><span>${Math.round(pct)}%</span></div><div class="track"><div class="fill ${pct>=100?'ok':pct<70?'warn':''}" style="width:${p}%"></div></div></div>`;

// 11/02 화면 개편: 그래프 공통 부품
const KCOL={mnp:'#2b6ef2',dev:'#14b8a6',gwatch:'#8b5cf6',awatch:'#f59e0b',net:'#94a3b8'};
const CHCOL={moyo:'#7c5cf0',hotdeal:'#f0566a',online:'#2b6ef2'};
const monDays=()=>new Date(+MONTH.slice(0,4),+MONTH.slice(5,7),0).getDate();
// 일별 막대: 막대 위에 값, 오늘은 진한 색
function dailyChart(rows,valFn,lab){
  const day=Number(TODAY.slice(8)),days=monDays(),vals=[];
  for(let d=1;d<=days;d++){const ds=MONTH+'-'+pad(d);vals.push([d,d<=day?sum(rows.filter(x=>x.date===ds),valFn):null]);}
  const max=Math.max(1,...vals.map(v=>Math.abs(v[1]||0)));
  const L=lab||(v=>short(v).replace('원',''));
  return `<div class="dchart">${vals.map(([d,v])=>{const wk=new Date(+MONTH.slice(0,4),+MONTH.slice(5,7)-1,d).getDay();
    return `<div class="c${v===null?' fu':''}${d===day?' td':''}${d===1||d%5===0||d===day?' k':''}${v&&Math.abs(v)===max?' mx':''}" title="${d}일 ${v===null?'':L(v)}"><b>${v?L(v):''}</b><i class="${v<0?'n':''}" style="height:${v?Math.max(3,Math.abs(v)/max*100):0}%"></i><span class="${wk===0?'su':wk===6?'sa':''}">${d}</span></div>`;}).join('')}</div>`;
}
// 누적 개통 선 그래프: 실제 누적 · 목표 기준선(점선) · 이 속도면 월말(흐린 점선)
function cumChart(rows,goal){
  const days=monDays(),day=+TODAY.slice(8),W=640,H=210,l=34,r=12,t=14,bt=26;
  const cnt=[];let acc=0;for(let d=1;d<=day;d++){acc+=rows.filter(x=>x.date===MONTH+'-'+pad(d)).length;cnt.push(acc);}
  const proj=day?acc/day*days:0,top=Math.max(goal,proj,acc,1)*1.08;
  const X=d=>l+(W-l-r)*(d/days),Y=v=>t+(H-t-bt)*(1-v/top);
  const pts=cnt.map((v,i)=>X(i+1).toFixed(1)+','+Y(v).toFixed(1));
  const line='M'+X(0)+','+Y(0)+' L'+pts.join(' L');
  const area=line+` L${X(day).toFixed(1)},${Y(0)} Z`;
  const grid=[0,.5,1].map(f=>{const v=Math.round(goal*f);return `<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;}).join('');
  const xt=[1,10,20,days].map(d=>`<text x="${X(d)}" y="${H-6}" text-anchor="middle">${d}일</text>`).join('');
  return `<svg class="cum" viewBox="0 0 ${W} ${H}" role="img" aria-label="누적 개통 그래프">${grid}${xt}
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(days)}" y2="${Y(goal)}" class="goal"/>
    <path d="${area}" class="ar"/><path d="${line}" class="ln"/>
    <line x1="${X(day)}" y1="${Y(acc)}" x2="${X(days)}" y2="${Y(proj)}" class="pj"/>
    <circle cx="${X(day)}" cy="${Y(acc)}" r="5" class="dot"/>
    <text x="${Math.min(X(day),W-r-40)}" y="${Y(acc)-12}" text-anchor="middle" class="nv">${fmt(acc)}건</text></svg>
    <div class="lg"><span><i style="background:var(--blue)"></i>실제 누적</span><span><i class="dash"></i>목표 기준선</span><span><i class="dash lt"></i>이 속도면</span></div>`;
}
// 달성률 원형
function ring(pct,cls){
  const R=44,C=2*Math.PI*R,p=Math.max(0,Math.min(100,pct));
  return `<svg class="ring ${cls||''}" viewBox="0 0 108 108"><circle cx="54" cy="54" r="${R}" class="bg"/><circle cx="54" cy="54" r="${R}" class="fg" stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 54 54)"/><text x="54" y="60" text-anchor="middle">${Math.round(pct)}%</text></svg>`;
}
// 비율 막대 한 줄 + 범례: parts=[[이름,값,색]]
function stackBar(parts,unit){
  const tot=sum(parts,p=>Math.max(0,p[1]))||1,u=unit||'건';
  return `<div class="stk">${parts.filter(p=>p[1]>0).map(p=>`<i style="width:${p[1]/tot*100}%;background:${p[2]}" title="${esc(p[0])} ${fmt(p[1])}${u}"></i>`).join('')}</div>
    <div class="slg">${parts.map(p=>`<span><i style="background:${p[2]}"></i>${esc(p[0])} <b>${u==='원'?short(p[1]):fmt(p[1])+u}</b>${u!=='원'&&p[1]?`<em>${Math.round(p[1]/tot*100)}%</em>`:''}</span>`).join('')}</div>`;
}
// 가로 순위 막대: list=[[이름,막대값,오른쪽 글,아래 글]]
function rankBars(list){
  const max=Math.max(1,...list.map(x=>Math.abs(x[1])));
  return `<div class="rank">${list.map(([n,v,rt,sub],i)=>`<div class="rr"><div class="rt"><span><em>${i+1}</em>${esc(n)}</span><b class="${v<0?'neg':''}">${rt}</b></div><div class="rk"><i class="${v<0?'n':''}" style="width:${Math.abs(v)/max*100}%"></i></div>${sub?`<div class="rs">${sub}</div>`:''}</div>`).join('')||'<div class="empty">아직 판매건이 없습니다</div>'}</div>`;
}
const cardH=(t,sm,extra)=>`<div class="chd"><div><b>${t}</b>${sm?`<small>${sm}</small>`:''}</div>${extra||''}</div>`;
// 정액 수당 구간: 계단 칸 + 지금 위치
function tierCard(title,n,tiers,unit){
  const cur=tierOf(n,tiers),nx=nextTier(n,tiers);
  return `<div class="card tierc">${cardH(title,`지금 ${n}${unit}`,`<span class="pill ${cur?'ok':''}">${cur?'+'+short(cur):'미달'}</span>`)}
    <div class="steps">${tiers.map(([th,a],i)=>{const prev=i?tiers[i-1][0]:0,f=n>=th?100:n<=prev?0:(n-prev)/(th-prev)*100;
      return `<div class="sp ${n>=th?'on':nx&&th===nx[0]?'next':''}"><div class="sb"><i style="width:${f}%"></i></div><b>${th}${unit}</b><span>${short(a)}</span></div>`;}).join('')}</div>
    <div class="hint">${nx?`다음 구간까지 <b>${nx[0]-n}${unit}</b> · 달성하면 ${short(nx[1])}`:'최고 구간 달성'}</div></div>`;
}
function tags(x){
  return `<span class="tag ${x.channel}">${CH[x.channel]}</span><span class="tag">${x.region}</span>${x.idOpen?'<span class="tag">신분증</span>':''}`;
}
function saleItem(x,viewer,ck){
  const m=modelById(x.modelId),c=x.calc;
  const admin=ses.role==='admin';
  const val=admin?c.margin:incSum(viewer,x);
  const extras=[x.payback?'대납 '+short(x.paybackAmt):'',x.usedReturn?'중고폰 '+short(x.usedAmt):'',...addonNames(x)].filter(Boolean).join(' · ');
  let h=`<div class="it${ck&&sel.has(x.id)?' on':''}" data-open="${x.id}">${ck?`<input type="checkbox" class="ck" data-sel="${x.id}"${sel.has(x.id)?' checked':''} aria-label="선택">`:''}<div><div class="a">${esc(saleTitle(x,m))}</div>
    <div class="b">${tags(x)}${x.custName?esc(x.custName)+' · ':''}${md(x.date)} · ${esc(typeLine(x))}${admin?' · '+esc(pname(person(x.staffId))):''}${extras?'<br>'+extras:''}</div></div>
    <div class="m ${val<0?'neg':admin?'':'pos'}">${admin?won(val):'+'+won(val)}<small>${admin?'건당 마진':'내 수당'}</small></div></div>`;
  if(open===x.id){
    h+=`<div class="detail">`;
    if(!admin){h+=incFor(viewer,x).map(i=>`<div class="row"><span>${esc(i[0])}</span><b>+${won(i[1])}</b></div>`).join('');}
    if(admin||S.settings.showMargin){
      if(!admin)h+=`<div class="row tot"><span>회사 기준 건당 마진</span><b class="${c.margin<0?'neg':''}">${won(c.margin)}</b></div>`;
      else{
        h+=c.items.map(i=>`<div class="row"><span>${esc(i[0])}</span><b>${won(i[1])}</b></div>`).join('');
        h+=`<div class="row"><span>정책 수수료 합계</span><b>${won(c.fee)}</b></div>`;
        if(c.used)h+=`<div class="row"><span>+ 중고폰 반납</span><b>${won(c.used)}</b></div>`;
        h+=c.costs.map(i=>`<div class="row"><span>− ${esc(i[0])}</span><b>${won(-i[1])}</b></div>`).join('');
        h+=`<div class="row tot"><span>건당 마진</span><b class="${c.margin<0?'neg':''}">${won(c.margin)}</b></div>`;
      }
    }
    if(x.usedReturn&&!admin)h+=`<div class="row"><span>중고폰 반납 금액</span><b>${won(x.usedAmt)}</b></div>`;
    if(x.custName||x.custPhone)h+=`<div class="row"><span>고객</span><b>${esc([x.custName,x.custPhone].filter(Boolean).join(' · '))}</b></div>`;
    if(x.memo)h+=`<div class="row"><span>메모</span><b>${esc(x.memo)}</b></div>`;
    if(admin||x.staffId===viewer.id)h+=`<div style="display:flex;gap:8px"><button class="del" style="color:var(--blue);border-color:var(--blue)" data-act="editSale" data-id="${x.id}">이 판매건 수정</button><button class="del" data-act="delSale" data-id="${x.id}">이 판매건 삭제</button></div>`;
    h+=`</div>`;
  }
  return h;
}

let dashMet='n';
function dashView(){
  const rows=S.sales.filter(inMonth);
  const goal=Object.values(S.settings.target).reduce((a,b)=>a+b,0);
  const fee=sum(rows,x=>x.calc.fee),margin=sum(rows,x=>x.calc.margin);
  const labor=sum(S.pay.people,p=>payroll(p,rows).total);
  const today=rows.filter(x=>x.date===TODAY),n=rows.length;
  const days=monDays(),day=+TODAY.slice(8),pace=goal*day/days,proj=Math.round(n/day*days),gap=Math.round(n-pace),pct=goal?n/goal*100:0;
  const byModel={};rows.forEach(x=>{const m=modelById(x.modelId);const k=!isPhone(x)?KIND[x.type]:m?m.model:'-';byModel[k]=byModel[k]||{n:0,mg:0};byModel[k].n++;byModel[k].mg+=x.calc.margin;});
  const top=Object.entries(byModel).sort((a,b)=>b[1].n-a[1].n).slice(0,6);
  const staff=S.pay.people.map(p=>{const r=rows.filter(x=>x.staffId===p.id);return [pname(p),r.length,sum(r,x=>x.calc.margin)];}).sort((a,b)=>b[1]-a[1]);
  const kinds=Object.keys(TYPE_SHORT).map(k=>[TYPE_SHORT[k],rows.filter(x=>x.type===k).length,KCOL[k]]).filter((p,i)=>p[1]||i<2);

// 개통관리 필터에 걸린 판매건 (최근 순)
// 10/30 날짜 필터: 오늘·어제·이번 달·지난 달·월 선택·기간 직접 선택
function filtRange(){
  const r=filt.range;
  if(r==='today')return [TODAY,TODAY];
  if(r==='yday'){const d=new Date();d.setDate(d.getDate()-1);const y=ymd(d);return [y,y];}
  if(r==='pmonth'){const m=addMon(MONTH,-1);return [m+'-01',monEnd(m)];}
  if(r==='mon'&&filt.month)return [filt.month+'-01',monEnd(filt.month)];
  if(r==='custom'&&filt.from&&filt.to)return filt.from<=filt.to?[filt.from,filt.to]:[filt.to,filt.from];
  return [MONTH+'-01',monEnd(MONTH)];
}
const rangeLabel=()=>{const [a,b]=filtRange();return a===b?md(a):a.slice(8)==='01'&&b===monEnd(a.slice(0,7))?Number(a.slice(5,7))+'월':md(a)+'~'+md(b);};
const visSales=()=>{const [a,b]=filtRange();return S.sales.filter(x=>x.date>=a&&x.date<=b&&(filt.ch==='all'||x.channel===filt.ch)&&(filt.staff==='all'||x.staffId===filt.staff)).sort((a,b)=>b.date.localeCompare(a.date)||b.at-a.at);};
// 이번 달 목표 대비 진척 — 오늘 날짜만큼 와야 할 기준선과 지금 속도로 간 월말 예상
function progCard(){
  const rows=S.sales.filter(inMonth),n=rows.length,goal=Object.values(S.settings.target).reduce((a,b)=>a+b,0);
  const days=new Date(+MONTH.slice(0,4),+MONTH.slice(5,7),0).getDate(),day=+TODAY.slice(8);
  const pace=goal*day/days,proj=Math.round(n/day*days),pct=goal?n/goal*100:0,gap=Math.round(n-pace);
  return `<div class="card prog">
    <div class="ph"><div><div class="l">이번 달 개통 진척 <small>${Number(MONTH.slice(5))}월 ${day}일 / ${days}일</small></div><div class="v">${fmt(n)}<small> / 목표 ${fmt(goal)}건</small></div></div><div class="pct ${n>=pace?'pos':'neg'}">${pct.toFixed(0)}%</div></div>
    <div class="ptrack"><div class="fill ${pct>=100?'ok':n<pace*0.9?'warn':''}" style="width:${Math.min(100,pct)}%"></div><i style="left:${day/days*100}%"></i></div>
    <div class="pl"><span>오늘까지 기준선 ${fmt(Math.round(pace))}건 · <b class="${gap<0?'neg':'pos'}">${gap>=0?'+':''}${gap}건</b></span><span>이 속도면 월말 <b>${fmt(proj)}건</b></span></div>
    <div class="pr3">${REGIONS.map(t=>{const k=rows.filter(x=>x.region===t).length,g=S.settings.target[t]||0;return barRow(t,g?k/g*100:0,`${k}/${g}`);}).join('')}</div>
    <div class="pl" style="margin-top:2px"><span>${typeSplit(rows)}</span><span>${chKeys().map(k=>CH[k]+' '+rows.filter(x=>x.channel===k).length).join(' · ')}</span></div>
  </div>`;
}

    ${rows.map(x=>{const m=modelById(x.modelId),c=x.calc;return `<tr class="${sel.has(x.id)?'on':''}"><td class="c"><input type="checkbox" data-sel="${x.id}"${sel.has(x.id)?' checked':''} aria-label="선택"></td><td>${md(x.date)}</td><td style="white-space:nowrap">${esc(x.custName||'')}${x.custPhone?`<br><small style="color:var(--tx3)">${esc(x.custPhone)}</small>`:''}</td><td>${esc(person(x.staffId)?.name||'-')}</td><td><span class="tag ${x.channel}">${CH[x.channel]}</span></td><td>${x.region}${x.idOpen?' · 신분증':''}</td><td>${SALE_TYPE[x.type]||''}</td><td>${isPhone(x)?esc(planName(x.plan)):''}</td><td>${esc(m?m.model+' '+m.cap+(isPhone(x)?'':' (같이 개통)'):'-')}</td>

  <p class="note">줄을 누르면 수수료 항목별 내역이 열립니다. 마진은 입력한 날의 정책으로 고정됩니다.</p>`;

let spPick={model:new Set(),plan:new Set(),region:new Set()};
const spList=v=>v==null||v==='all'?[]:Array.isArray(v)?v:[v];

}

function payDetail(p,rows,r){
  const grp=new Map(),list=[];
  for(const x of rows){const inc=incFor(p,x);if(!inc.length)continue;list.push([x,inc]);
    for(const [l,a] of inc){const k=l+'|'+a,g=grp.get(k)||{l,a,n:0,add:Object.values(PAY_ADDON).includes(l)};g.n++;grp.set(k,g);}}
  const tb=(arr)=>arr.length?`<div class="tscroll" style="max-height:none"><table class="tbl"><thead><tr><th>항목</th><th class="r">건수</th><th class="r">건당</th><th class="r">합계</th></tr></thead><tbody>${arr.map(g=>`<tr><td>${esc(g.l)}</td><td class="r">${fmt(g.n)}</td><td class="r">${fmt(g.a)}</td><td class="r"><b>${fmt(g.n*g.a)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:8px 0">해당 없음</div>';
  const G=[...grp.values()].sort((a,b)=>a.l.localeCompare(b.l,'ko')||a.a-b.a);
  const tier=(n,t,unit)=>{const nx=nextTier(n,t),cur=[...t].reverse().find(([th])=>n>=th);return `${n}${unit} · ${cur?cur[0]+unit+' 이상 구간 '+won(cur[1]):'첫 구간('+t[0][0]+unit+') 미달'}${nx?' · 다음 구간까지 '+(nx[0]-n)+unit+' ('+won(nx[1])+')':' · 최고 구간'}`;};
  const sorted=list.sort((a,b)=>b[0].date.localeCompare(a[0].date)||(b[0].at||0)-(a[0].at||0));
  return `<div class="pdet">
    <div class="sec">기본급·복지수당</div><div class="row"><span>기본급${r.welfare?' + 복지수당':''}</span><b>${won(r.base+r.welfare)}</b></div>
    <div class="sec">건당 수당 <small>${won(r.perCase)}</small></div>${tb(G.filter(g=>!g.add))}
    <div class="sec">부가 판매 <small>${won(r.addon)} · 팀 전체 판매건</small></div>${tb(G.filter(g=>g.add))}
    <div class="sec">정액 수당</div>
    <div class="row"><span>실적 그레이드</span><b>${won(r.grade)}</b></div><div class="hint" style="margin:0 0 6px">${tier(r.n,S.pay.grade,'건')}</div>
    <div class="row"><span>남부 신분증 번이</span><b>${won(r.idt)}</b></div><div class="hint" style="margin:0 0 6px">${tier(r.idn,S.pay.idTier,'건')}</div>
    <div class="sec">판매건별 수당 <small>${list.length}건 · ${md(MONTH+'-01')}~${md(TODAY)}</small></div>
    ${list.length?`<div class="tscroll" style="max-height:420px"><table class="tbl"><thead><tr><th>개통일</th><th>담당</th><th>경로</th><th>유형</th><th>요금제</th><th>모델</th><th>받는 수당</th><th class="r">금액</th></tr></thead><tbody>${sorted.map(([x,inc])=>{const m=x.modelId&&modelById(x.modelId);return `<tr><td>${md(x.date)}</td><td>${x._team?'팀':esc(person(x.staffId)?.name||'-')}</td><td>${esc(CH[x.channel]||x.channel)}</td><td>${SALE_TYPE[x.type]||''}${isIdSouth(x)?' · 남부신분증':''}</td><td>${isPhone(x)?esc(planName(x.plan)):''}</td><td>${m?esc(m.model+' '+m.cap):'-'}</td><td>${inc.map(i=>esc(i[0])).join(', ')}</td><td class="r"><b>${fmt(inc.reduce((a,b)=>a+b[1],0))}</b></td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty" style="padding:8px 0">수당이 붙은 판매건이 없습니다</div>'}
  </div>`;
}

function draft(me){return fixKind({...form,staffId:me.id});}
function sbarNums(me){
  const x=draft(me),c=calc(x),inc=incSum(me,x);
  return `<div class="k">이 건 내 수당</div><div class="v">+${won(inc)}</div>${S.settings.showMargin&&c?`<div class="s">회사 건당 마진 <span class="${c.margin<0?'neg':''}">${won(c.margin)}</span></div>`:''}`;
}
function calcBox(me){
  const x=draft(me),c=calc(x);if(!c)return '';
  let h=incFor(me,x).map(i=>`<div class="row spot"><span>내 수당 · ${esc(i[0])}</span><b>+${won(i[1])}</b></div>`).join('');
  if(S.settings.showMargin){
    h+=`<div class="row tot"><span>정책 수수료</span><b>${won(c.fee)}</b></div>`;
    h+=c.items.filter(i=>i[2]).map(i=>`<div class="row spot"><span>${esc(i[0])}</span><b>+${won(i[1])}</b></div>`).join('');
    if(c.used)h+=`<div class="row spot"><span>중고폰 반납</span><b>+${won(c.used)}</b></div>`;
    h+=c.costs.map(i=>`<div class="row minus"><span>${esc(i[0])}</span><b>${won(-i[1])}</b></div>`).join('');
    h+=`<div class="row tot"><span>회사 건당 마진</span><b class="${c.margin<0?'neg':''}">${won(c.margin)}</b></div>`;
  }
  return h;
}
// 저장 전 확인 (워치는 같이 개통한 폰이 조건에 맞아야 저장)
function saleOk(x){
  if(x.payback&&!x.paybackAmt){toast('대납 금액을 입력하세요');return false;}
  if(x.usedReturn&&!x.usedAmt){toast('중고폰 반납 금액을 입력하세요');return false;}
  if(WATCH[x.type]&&!watchOk(x.type,modelById(x.modelId))){toast(KIND[x.type]+'는 '+WATCH[x.type].cond+' 동시개통만 저장됩니다');return false;}
  if(!calc(x)){toast('모델을 다시 고르세요');return false;}
  return true;
}
function refreshCalc(me){const a=document.getElementById('calcBox'),b=document.getElementById('sbarNums');if(a)a.innerHTML=calcBox(me);if(b)b.innerHTML=sbarNums(me);}

function newRow(me){return {date:TODAY,staffId:me?me.id:'',channel:'moyo',region:'남부',type:'mnp',idOpen:false,plan:defPlan(),model:'',modelId:'',paybackAmt:0,usedAmt:0,ins:false,gwatch:false,awatch:false,net:false,memo:'',custName:'',custPhone:'',err:''};}
const isBlank=r=>isPhone(r)&&!r.modelId&&!r.memo&&!r.custName&&!r.custPhone&&!r.paybackAmt&&!r.usedAmt&&!r.err;
function rowErr(r){
  if(r.err)return r.err;
  if(WATCH[r.type]){if(!r.modelId)return '같이 개통한 폰 모델을 고르세요';if(!watchOk(r.type,modelById(r.modelId)))return KIND[r.type]+'는 '+WATCH[r.type].cond+' 동시개통만';}
  else if(isPhone(r)&&!r.modelId)return '모델을 고르세요';
  if(!r.staffId&&ses.role==='admin')return '담당자를 고르세요';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date))return '개통일 확인';
  return '';
}
const rowSale=r=>fixKind({date:r.date,staffId:ses.role==='seller'?ses.pid:r.staffId,channel:r.channel,region:r.region,idOpen:r.type==='mnp'&&r.idOpen,modelId:r.modelId,type:r.type,plan:r.plan,

function entryRes(r,me){
  if(isBlank(r))return '<span style="color:var(--tx3)">-</span>';

const yes=v=>/^(o|y|yes|1|true|있음|예|v|✓|ㅇ|●)$/i.test(String(v??'').trim());
const normName=s=>String(s??'').toLowerCase().replace(/갤럭시|galaxy|\s/g,'').replace(/^z/,'').replace(/울트라/g,'ultra').replace(/플러스/g,'+').replace(/프로맥스/g,'promax').replace(/프로/g,'pro').replace(/맥스/g,'max').replace(/엣지/g,'edge');
function pDate(v){
  if(typeof v==='number'&&v>30000)return ymd(new Date(Math.round((v-25569)*864e5)));
  const t=String(v??'').trim();let m=t.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  m=t.match(/^(\d{1,2})\s*[-./월]\s*(\d{1,2})/);if(m)return TODAY.slice(0,4)+'-'+pad(m[1])+'-'+pad(m[2]);
  return '';
}
function pModel(name,cap){
  const n=normName(name);if(!n)return null;
  const all=[...new Set(S.policy.models.map(m=>m.model))];
  let nm=all.find(a=>normName(a)===n);
  if(!nm){const c=all.filter(a=>n.includes(normName(a))).sort((a,b)=>normName(b).length-normName(a).length);nm=c[0];}
  if(!nm)return null;
  const caps=S.policy.models.filter(m=>m.model===nm);
  const cn=String(cap??'').toUpperCase().replace(/\s|GB/g,'').replace(/^(\d)T$/,'$1TB');
  if(!cn)return caps[0];
  return caps.find(m=>m.cap.toUpperCase().replace(/\s|GB/g,'')===cn)||null;
}
function importRows(aoa){
  const me=person(ses.pid),admin=ses.role==='admin';
  const out=[];
  for(const raw of aoa){
    const c=raw.map(v=>typeof v==='string'?v.trim():v);
    if(!c.some(v=>String(v).trim()))continue;
    if(/담당|개통일/.test(String(c[0]))||/개통일/.test(String(c[1])))continue;
    const r=newRow(me),errs=[];
    if(admin){const nm=String(c[0]||'').trim();const p=S.pay.people.find(p=>nm&&(p.name===nm||nm.includes(p.name)));if(p)r.staffId=p.id;else errs.push('담당자');}
    r.date=pDate(c[1])||(String(c[1]).trim()?'':TODAY);if(!r.date){errs.push('개통일');r.date=TODAY;}
    const ch=String(c[2]);r.channel=/모요/.test(ch)?'moyo':/핫딜|홈페이지|홈피/.test(ch)?'hotdeal':(ch.trim()?(errs.push('판매경로'),'moyo'):'moyo');
    const rg=REGIONS.find(x=>String(c[3]).includes(x));if(rg)r.region=rg;else errs.push('개통지역');
    const ty=String(c[4]);r.type=/인터넷|net/i.test(ty)?'net':/애플|apple/i.test(ty)?'awatch':/갤|galaxy/i.test(ty)&&/워치|watch/i.test(ty)?'gwatch':/워치|watch/i.test(ty)?'watch?':/기|dev/i.test(ty)?'dev':/번|이동|mnp/i.test(ty)?'mnp':(errs.push('가입유형'),'mnp');
    r.idOpen=r.type==='mnp'&&yes(c[5]);
    if(isPhone(r)&&String(c[6]??'').trim()){const pl=pPlan(c[6]);if(pl)r.plan=pl;else errs.push('요금제 "'+String(c[6])+'"');}
    const m=r.type==='net'?null:pModel(c[7],c[8]);if(m){r.model=m.model;r.modelId=m.id;}else if(r.type!=='net')errs.push('모델·용량 "'+String(c[7]??'')+' '+String(c[8]??'')+'"');
    if(r.type==='watch?')r.type=watchOk('awatch',m)?'awatch':'gwatch';
    if(WATCH[r.type]&&m&&!watchOk(r.type,m))errs.push(KIND[r.type]+'는 '+WATCH[r.type].cond+' 동시개통만');
    if(isPhone(r)){r.paybackAmt=num(c[9]);r.usedAmt=num(c[10]);r.ins=yes(c[11]);}else if(WATCH[r.type])r.paybackAmt=num(c[9]);
    r.memo=String(c[12]??'');r.custName=String(c[13]??'').trim();r.custPhone=telFmt(c[14]);
    if(errs.length)r.err='확인: '+errs.join(', ');
    out.push(r);
  }
  if(!out.length){toast('읽을 수 있는 줄이 없습니다');return 0;}
  entry.rows=entry.rows.filter(r=>!isBlank(r)).concat(out);
  render();
  const bad=out.filter(r=>r.err).length;
  toast(out.length+'줄 넣었습니다'+(bad?' · 확인 필요 '+bad+'줄':''));
  return out.length;
}

function policyIn(wb){
  const P=S.policy,get=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}):null;
  let nm=0,miss=[],nc=0;
  const mr=get('모델정책');
  if(mr)for(const row of mr.slice(1)){
    if(!String(row[1]).trim())continue;
    const m=P.models.find(m=>m.model===String(row[1]).trim()&&m.cap===String(row[2]).trim());
    if(!m){miss.push(row[1]+' '+row[2]);continue;}
    m.act.mnp=num(row[4]);m.act.dev=num(row[5]);
    const rp=num(row[6]);if(m.rep!=null||rp!==repBase())m.rep=rp;
    nm++;
  }
  const cr=get('공통수수료');
  const hd=cr?cr[0].map(v=>String(v).trim()):[],cols=P.items.map(it=>[it.k,hd.indexOf(it.l)]).filter(([,j])=>j>=0);
  if(cr)for(const row of cr.slice(1)){
    const t=String(row[0]).includes('번호')?'mnp':String(row[0]).includes('기기')?'dev':null,p=pPlan(row[1]);
    if(!t||!p)continue;const c=P.common[t][p];cols.forEach(([k,j])=>{c[k]=num(row[j]);});nc++;
  }
  const kr=get('건당비용');
  if(kr)for(const row of kr.slice(1)){const k=Object.keys(CH).find(k=>String(row[0]).startsWith(CH[k]));if(k)P.cost[k]=num(row[1]);}
  fixPolicy(P);
  if(!mr&&!cr){toast('정책서 양식이 아닙니다. 먼저 "정책 엑셀 내려받기"로 받은 파일을 고쳐서 올리세요');return;}
  save();render();
  toast(`모델 ${nm}개 · 공통 ${nc}줄 반영${miss.length?' · 못 찾은 모델 '+miss.length+'개':''}`);
  if(miss.length)setTimeout(()=>alert('정책서에 없는 모델이라 건너뛴 줄:\n'+miss.join('\n')+'\n\n모델명·용량은 내려받은 그대로 두세요.'),50);
}

    if(!em.trim()&&!confirm('이 직원의 로그인 연결을 해제할까요?'))return;
    sb.rpc('erp_link',{p_pid:id,p_email:toLogin(em)}).then(({data,error})=>{if(error){toast(/그 이메일로/.test(error.message)?'그 아이디로 만든 계정이 없습니다. 직원이 먼저 이 시스템에서 계정을 만들어야 합니다':sbErr(error));return;}toast(em.trim()?data+' 계정 연결 완료':data+' 연결 해제');refresh();});}
  else if(a==='clearDemo'){if(confirm('예시 판매건을 모두 지우고 빈 상태로 시작할까요? 정책·급여표·스팟은 그대로 둡니다.')){S.sales=[];S.demo=false;save();render();toast('예시 판매건을 지웠습니다');}}
  else if(a==='saveSale'){
    const me=person(ses.pid);if(!me)return;
    if(!saleOk(draft(me)))return;
    const x={...draft(me),id:uid(),at:Date.now()};delete x.model;x.custName=(x.custName||'').trim();x.custPhone=telFmt(x.custPhone);
    if(x.type!=='mnp')x.idOpen=false;
    x.calc=calc(x);S.sales.push(x);save();
    toast('저장했습니다 · 내 수당 +'+won(incSum(me,x)));
    form={...newForm(),date:form.date,channel:form.channel,region:form.region,type:form.type,plan:form.plan};render();scrollTo(0,0);
  }
  else if(a==='editSale'){const x=S.sales.find(y=>y.id===t.dataset.id);if(!x||x._team)return;
    if(ses.role!=='admin'&&x.staffId!==ses.pid)return;
    const m=modelById(x.modelId);
    edit={id:x.id,back:tab==='edit'?edit.back:tab,keep:edit?edit.keep:form};
    form={...newForm(),...clone(x),model:m?m.model:'',payback:!!x.paybackAmt,usedReturn:!!x.usedAmt};delete form.calc;
    if(!form.plan)form.plan=defPlan();
    if(!m&&x.type==='net'){const f=S.policy.models[0];form.model=f.model;form.modelId=f.id;}
    else if(!m){const f=S.policy.models[0];form.model=f.model;form.modelId=f.id;toast('이 건의 모델이 정책서에 없어 첫 모델로 바꿔 보여줍니다. 모델을 다시 고르세요');}
    tab='edit';open=null;render();scrollTo(0,0);}
  else if(a==='cancelEdit'){if(edit){form=edit.keep;tab=edit.back;edit=null;}render();scrollTo(0,0);}
  else if(a==='updSale'){
    if(!edit)return;const i=S.sales.findIndex(y=>y.id===edit.id);if(i<0)return;
    if(ses.role!=='admin'&&S.sales[i].staffId!==ses.pid)return;
    const x=fixKind({...form,id:edit.id,at:S.sales[i].at,editedAt:Date.now()});
    if(!saleOk(x))return;delete x.model;x.custName=(x.custName||'').trim();x.custPhone=telFmt(x.custPhone);
    if(ses.role!=='admin')x.staffId=ses.pid;
    if(x.type!=='mnp')x.idOpen=false;
    if(!x.payback)x.paybackAmt=0;if(!x.usedReturn)x.usedAmt=0;
    x.calc=calc(x);S.sales[i]=x;save();
    form=edit.keep;tab=edit.back;edit=null;render();scrollTo(0,0);toast('수정했습니다');
  }
  else if(a==='payDet'){const id=t.dataset.id;payOpen.has(id)?payOpen.delete(id):payOpen.add(id);render();}
  else if(a==='delSel'||a==='delAll'){
    const ids=new Set(a==='delAll'?visSales().map(x=>x.id):[...sel]);if(!ids.size)return;
    if(a==='delAll'){if(prompt(`지금 보이는 판매건 ${ids.size}건을 모두 삭제합니다. 되돌릴 수 없습니다.\n계속하려면 '삭제'라고 입력하세요.`)!=='삭제'){toast('삭제하지 않았습니다');return;}}
    else if(!confirm(`선택한 판매건 ${ids.size}건을 삭제할까요? 되돌릴 수 없습니다.`))return;
    S.sales=S.sales.filter(x=>!ids.has(x.id));sel.clear();open=null;save();render();toast(ids.size+'건 삭제했습니다');}
  else if(a==='delSale'){if(confirm('이 판매건을 삭제할까요?')){S.sales=S.sales.filter(x=>x.id!==t.dataset.id);sel.delete(t.dataset.id);open=null;save();render();toast('삭제했습니다');}}
  else if(a==='addSpot'){
    const g=id=>document.getElementById(id).value;
    const pk=k=>spPick[k].size?[...spPick[k]]:'all';
    const sp={id:uid(),name:g('sp_name').trim(),from:g('sp_from'),to:g('sp_to'),model:pk('model'),type:g('sp_type'),plan:pk('plan'),region:pk('region'),amt:num(g('sp_amt'))};
    if(!sp.name||!sp.amt||!sp.from||!sp.to){toast('이름·기간·금액을 입력하세요');return;}
    if(sp.to<sp.from){toast('종료일이 시작일보다 빠릅니다');return;}
    S.spots.push(sp);spPick={model:new Set(),plan:new Set(),region:new Set()};save();render();toast('스팟 정책을 등록했습니다');
  }
  else if(a==='addPlan'){const P=S.policy,nm=document.getElementById('npl_name').value.trim(),pr=num(document.getElementById('npl_price').value);
    if(!nm){toast('요금제 이름을 넣으세요');return;}
    if(P.plans.some(p=>p.name===nm)){toast('같은 이름의 요금제가 이미 있습니다');return;}
    P.plans.push({id:'pl'+uid(),name:nm,price:pr});P.plans.sort((a,b)=>b.price-a.price);fixPolicy(P);save();render();toast(nm+' 추가 · 요금제 수수료를 입력하세요');}
  else if(a==='delPlan'){const P=S.policy,p=P.plans[Number(t.dataset.i)];if(!p)return;
    if(P.plans.length<=1){toast('요금제는 하나 이상 있어야 합니다');return;}
    if(!confirm(p.name+' 요금제를 목록에서 지울까요? 이 요금제의 공통 수수료도 지워집니다. 이미 저장된 판매건 마진은 바뀌지 않습니다.'))return;
    P.plans=P.plans.filter(x=>x!==p);for(const t of ['mnp','dev'])delete P.common[t][p.id];
    if(form&&form.plan===p.id)form.plan=defPlan();save();render();toast('지웠습니다');}
  else if(a==='addItem'){const P=S.policy,nm=document.getElementById('ni_name').value.trim();
    if(!nm){toast('항목 이름을 넣으세요');return;}
    if(P.items.some(it=>it.l===nm)){toast('같은 이름의 항목이 이미 있습니다');return;}
    const at=P.items.findIndex(it=>it.k==='rep');P.items.splice(at<0?P.items.length:at,0,{k:'c'+uid(),l:nm});fixPolicy(P);save();render();toast(nm+' 항목 추가 · 번이·기변 공통 금액을 입력하세요');}
  else if(a==='delItem'){const P=S.policy,it=P.items[Number(t.dataset.i)];if(!it||it.k==='rep')return;
    if(!confirm(it.l+' 항목을 지울까요? 모든 요금제의 이 금액이 빠집니다. 이미 저장된 판매건 마진은 바뀌지 않습니다.'))return;
    P.items=P.items.filter(x=>x!==it);for(const t of ['mnp','dev'])for(const c of Object.values(P.common[t]))delete c[it.k];save();render();toast('지웠습니다');}
  else if(a==='delSpot'){if(confirm('이 스팟 정책을 삭제할까요? 이미 저장된 판매건 마진은 바뀌지 않습니다.')){S.spots=S.spots.filter(s=>s.id!==t.dataset.id);save();render();}}
  else if(a==='toggleMargin'){S.settings.showMargin=!S.settings.showMargin;save();render();}
  else if(a==='resetPolicy'){if(confirm('공통 수수료·요금제 목록·수수료 항목·모델별 판매활성화를 원본값으로 되돌릴까요? 저장된 판매건 마진은 바뀌지 않습니다.')){S.policy=freshPolicy();save();render();toast('원본값으로 되돌렸습니다');}}
  else if(a==='dlSales'){const rows=visSales().reverse();
    const [fa,fb]=filtRange();xlsxOut('판매건_'+(fa===fb?fa:fa.slice(8)==='01'&&fb===monEnd(fa.slice(0,7))?fa.slice(0,7):fa+'~'+fb),[['판매건',salesAoa(rows,null)],...(fa.slice(0,7)===MONTH&&fb.slice(0,7)===MONTH?[['급여',payAoa(S.pay.people)]]:[])]);}
  else if(a==='backupNow'){const [fa,fb]=filtRange();const ms=[];for(let m=fa.slice(0,7);m<=fb.slice(0,7)&&m<MONTH;m=addMon(m,1))ms.push(m);
    Promise.all(ms.map(m=>sb.rpc('erp_backup_month',{p_month:m}))).then(rs=>{const e=rs.find(r=>r.error);if(e){toast('백업 실패 · '+sbErr(e.error));return;}toast(ms.map((m,i)=>Number(m.slice(5))+'월 '+rs[i].data+'건').join(', ')+' 백업했습니다');loadBackups();});}
  else if(a==='dlBackup'){const [fa,fb]=filtRange();
    sb.from('erp_sales_backup').select('data,gone,backed_at').gte('month',fa.slice(0,7)).lte('month',fb.slice(0,7)).then(({data,error})=>{if(error){toast(sbErr(error));return;}
      const rows=data.map(r=>({...r.data,_gone:r.gone})).sort((a,b)=>a.date.localeCompare(b.date)||a.at-b.at),aoa=salesAoa(rows,null);
      aoa[0].push('지금 상태');rows.forEach((x,i)=>aoa[i+1].push(x._gone?'원본에서 삭제됨':''));
      xlsxOut('백업_판매건_'+fa.slice(0,7)+(fa.slice(0,7)===fb.slice(0,7)?'':'~'+fb.slice(0,7)),[['백업 판매건',aoa]]);});}
  else if(a==='dlMine'){const me=person(ses.pid);const rows=S.sales.filter(x=>x.staffId===me.id&&(mineRange==='today'?x.date===TODAY:inMonth(x))).sort((a,b)=>a.date.localeCompare(b.date)||a.at-b.at);
    xlsxOut('내판매건_'+me.name+'_'+(mineRange==='today'?TODAY:MONTH),[['내 판매',salesAoa(rows,me)],['내 급여',payAoa([me])]]);}
  else if(a==='dlPay'){xlsxOut('온라인팀_급여_'+MONTH,[['급여',payAoa(S.pay.people)]]);}
  else if(a==='dlPolicy'){policyOut();}
  else if(a==='dlTemplate'){xlsxOut('판매건_등록양식',[['판매건',[ENTRY_COLS,[person(ses.pid)?.name||'방민정',TODAY,'모요','남부','번이','O','85','아이폰18 PRO','256GB','50000','','O','','홍길동','010-1234-5678'],[person(ses.pid)?.name||'방민정',TODAY,'모요','남부','애플워치','','','아이폰18 PRO','256GB','','','','','홍길동','010-1234-5678'],[person(ses.pid)?.name||'방민정',TODAY,'모요','남부','인터넷','','','','','','','','','홍길동','010-1234-5678']]]]);}
  else if(a==='entryAdd'){const me=person(ses.pid);for(let i=0;i<5;i++)entry.rows.push(newRow(me));render();}
  else if(a==='entryDel'){entry.rows.splice(Number(t.dataset.i),1);if(!entry.rows.length)entry.rows.push(newRow(person(ses.pid)));render();}
  else if(a==='entryClear'){if(confirm('입력 중인 줄을 모두 비울까요? 이미 저장한 판매건은 그대로 둡니다.')){entry=null;render();}}
  else if(a==='entryPaste'){const ta=document.getElementById('e_paste');const n=importRows(ta.value.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t')));if(n)ta.value='';}
  else if(a==='entrySave'){entrySave();}
  else if(a==='resetPay'){if(confirm('급여표를 처음 받은 값으로 되돌릴까요? 직원 목록과 새로 추가한 직원의 기본급은 그대로 둡니다.')){const d=clone(DEFAULT_PAY);d.people=S.pay.people.map(p=>{const o=d.people.find(x=>x.id===p.id);return o?{...p,base:o.base,welfare:o.welfare}:p;});S.pay=d;save();render();toast('되돌렸습니다');}}
});
document.addEventListener('input',e=>{if(e.target.dataset.b&&e.target.type!=='checkbox'&&e.target.tagName==='INPUT'&&e.target.type!=='date')entryField(e.target);});
document.addEventListener('change',e=>{
  const el=e.target,v=num(el.value);
  if(el.dataset.b){entryField(el);return;}
  if(el.dataset.fdate){filt.from=filt.from||MONTH+'-01';filt.to=filt.to||TODAY;filt[el.dataset.fdate]=el.value||(el.dataset.fdate==='from'?MONTH+'-01':TODAY);open=null;sel.clear();render();return;}
  if(el.hasAttribute('data-fmon')){if(el.value){filt.range='mon';filt.month=el.value;}else filt.range='month';open=null;sel.clear();render();return;}
  if(el.id==='up_policy'&&el.files[0]){readXlsx(el.files[0],policyIn);el.value='';return;}
  if(el.id==='up_sales'&&el.files[0]){readXlsx(el.files[0],wb=>{const ws=wb.Sheets[wb.SheetNames[0]];importRows(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));});el.value='';return;}
  if(el.dataset.plan){const [i,f]=el.dataset.plan.split('.'),p=S.policy.plans[Number(i)];if(!p)return;
    if(f==='name'){const nm=el.value.trim();if(!nm||S.policy.plans.some(x=>x!==p&&x.name===nm)){el.value=p.name;toast(nm?'같은 이름의 요금제가 이미 있습니다':'이름을 비울 수 없습니다');return;}p.name=nm;}
    else{p.price=v;S.policy.plans.sort((a,b)=>b.price-a.price);}
    save();render();toast('요금제 저장');return;}
  if(el.dataset.item){const it=S.policy.items[Number(el.dataset.item)],nm=el.value.trim();if(!it)return;
    if(!nm||S.policy.items.some(x=>x!==it&&x.l===nm)){el.value=it.l;toast(nm?'같은 이름의 항목이 이미 있습니다':'이름을 비울 수 없습니다');return;}
    it.l=nm;save();render();toast('항목 이름 저장');return;}
  if(el.dataset.polall){const [t,k]=el.dataset.polall.split('.');for(const c of Object.values(S.policy.common[t]))c[k]=v;save();render();toast(TYPE[t]+' 전 요금제 저장');return;}
  if(el.dataset.pol){setPath(S.policy,el.dataset.pol,v);el.value=fmt(v);el.classList.add('chg');save();if(el.dataset.pol.endsWith('.planfee'))render();toast('정책 저장');}
  else if(el.dataset.pay){setPath(S.pay,el.dataset.pay,v);save();render();toast('급여표 저장');}
  else if(el.dataset.set){S.settings.target[el.dataset.set.split('.')[1]]=v;save();toast('목표 저장');}
});

let wasPC=PC();addEventListener('resize',()=>{if(PC()!==wasPC){wasPC=PC();render();}});
document.addEventListener('submit',e=>{if(e.target.id==='lgform'){e.preventDefault();signIn(lgMode==='up');}});
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&boot==='ready'){S=null;ses={};acct=null;base=null;boot='login';render();}});
render();load().then(()=>{listen();render();}).catch(e=>{boot='error';acct={msg:sbErr(e)};render();});
})();
</script>
</body>
</html>
